[workspace]
resolver = "3"
members = ["crates/automount"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/scottfk/autofs-rs"
rust-version = "1.88"

[workspace.dependencies]
libc = "0.2"
# The libtirpc subset, from rpcbind-rs (pinned; see the README).
tirpc = { git = "https://github.com/scottfk/rpcbind-rs", rev = "a9a5199dc95bcfc5c88c62f101cb634c5b3df5b7" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
