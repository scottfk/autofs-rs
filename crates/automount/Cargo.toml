[package]
name = "automount"
description = "Drop-in Rust port of the Linux automounter (autofs 5)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "automount"
path = "src/lib.rs"

[[bin]]
name = "automount"
path = "src/main.rs"

# Test driver for the differential tests (not installed): reads the master
# map and the maps as the daemon does, then looks up keys.
[[bin]]
name = "automount-drv"
path = "src/bin/automount_drv.rs"
test = false

# Fake rpcbind, NFS and mount daemons for the root tier's NFS cases (not
# installed).
[[bin]]
name = "fake-nfsd"
path = "src/bin/fake_nfsd.rs"
test = false

[dependencies]
libc.workspace = true
tirpc.workspace = true

[lints]
workspace = true

[dev-dependencies]
libc.workspace = true
